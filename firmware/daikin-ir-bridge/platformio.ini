; Daikin IR bridge: receives mark/space patterns from the iOS app over Wi-Fi and sends them
; through an IR LED. Build/flash with:  pio run -e esp32 -t upload   (or -e esp8266)

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    crankyoldgit/IRremoteESP8266 @ ^2.8.6

[env:esp32]
platform = espressif32
board = esp32dev

[env:esp8266]
platform = espressif8266
board = d1_mini
