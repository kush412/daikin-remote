# XcodeGen spec. Generate the Xcode project with:  brew install xcodegen && xcodegen
name: DaikinRemote
options:
  bundleIdPrefix: vn.cake
  deploymentTarget:
    iOS: "17.0"
packages:
  DaikinCore:
    path: DaikinCore
targets:
  DaikinRemote:
    type: application
    platform: iOS
    sources: [DaikinRemote]
    dependencies:
      - package: DaikinCore
    info:
      path: DaikinRemote/Info.plist
      properties:
        CFBundleDisplayName: Daikin Remote
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: Sends commands to the Daikin IR bridge on your Wi-Fi.
        NSBonjourServices: [_http._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.cake.daikinremote
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Set your team here, or pick it in Xcode under Signing & Capabilities.
        DEVELOPMENT_TEAM: ""
